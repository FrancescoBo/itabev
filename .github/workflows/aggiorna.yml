name: Aggiorna tabella EV
on:
  workflow_dispatch:
    inputs:
      modelli:
        description: "Prova: modelli separati da spazio (es. tesla/model-3 dacia/spring). Vuoto = tutto il listino"
        required: false
        default: ""
  schedule:
    - cron: "0 5 1 * *"     # il 1 di ogni mese, listino completo
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Scraper
        env:
          MODELLI: ${{ github.event.inputs.modelli }}
        run: |
          if [ -n "$MODELLI" ]; then python scrape.py --debug --models $MODELLI; else python scrape.py --debug; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: debug, path: debug/ }
      - name: Commit risultati
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data index.html && git commit -m "Aggiornamento dati $(date +%F)" || echo "nessuna modifica"
          git push
