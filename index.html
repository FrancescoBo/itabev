th.onclick=e=>{const k=e.target.closest("th")?.dataset.k;if(!k)return;sd=sk==k?-sd:1;sk=k;render()};

 document.querySelector("#t tbody").innerHTML=r.map(d=>`<tr class="${d.stato!="disponibile"?"esa":""}">`+cols.map(c=>{const v=d[c[0]];
